[package]
name = "solvency_proof"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
thiserror = "2.0"
postcard = { version = "1", features = ["use-std"] }
rand = { version = "0.10", features = ["std_rng", "sys_rng"] }

# Plonky3 (STARK / FRI). The API is still moving, so the version is pinned exactly.
p3-air = "=0.9.0-rc.2"
p3-challenger = "=0.9.0-rc.2"
p3-commit = "=0.9.0-rc.2"
p3-dft = "=0.9.0-rc.2"
p3-field = "=0.9.0-rc.2"
p3-fri = "=0.9.0-rc.2"
p3-goldilocks = "=0.9.0-rc.2"
p3-matrix = "=0.9.0-rc.2"
p3-merkle-tree = "=0.9.0-rc.2"
p3-poseidon2 = "=0.9.0-rc.2"
p3-poseidon2-air = "=0.9.0-rc.2"
p3-symmetric = "=0.9.0-rc.2"
p3-uni-stark = "=0.9.0-rc.2"
